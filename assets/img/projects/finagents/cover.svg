<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 760 340" role="img" aria-labelledby="t d">
<title id="t">Multi-agent financial analysis crew</title>
<desc id="d">Four CrewAI agents collaborate in a pipeline: a data analyst identifies market signals, a strategy developer drafts trading strategies, a trade advisor plans execution, and a risk advisor assesses exposure before a final recommendation.</desc>
<defs><linearGradient id="bg2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#1F1D1B"/><stop offset="1" stop-color="#141413"/></linearGradient><pattern id="dots2" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="1" cy="1" r="0.8" fill="#FFFFFF" fill-opacity="0.06"/></pattern><marker id="ar2" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M1 1 L9 5 L1 9" fill="none" stroke="#D97757" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"/></marker></defs>
<rect width="760" height="340" fill="url(#bg2)"/>
<rect width="760" height="340" fill="url(#dots2)"/>
<text x="24" y="34" font-family="ui-monospace,Consolas,monospace" font-size="14.5" letter-spacing="1" fill="#A29F94">ANALYST &#8594; STRATEGIST &#8594; TRADE ADVISOR &#8594; RISK ADVISOR</text>
<text x="736" y="34" font-family="ui-monospace,Consolas,monospace" font-size="13" fill="#D97757" text-anchor="end">$ AAPL</text>

<!-- Agent 1: Data Analyst -->
<g>
<rect x="30" y="108" width="154" height="164" rx="8" fill="#191816" stroke="#3A3733"/>
<rect x="30" y="108" width="154" height="28" rx="8" fill="#22201E"/>
<rect x="30" y="126" width="154" height="10" fill="#22201E"/>
<text x="44" y="127" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#D97757">01</text>
<text x="107" y="127" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#F4F1EA" text-anchor="middle">Data Analyst</text>
<text x="107" y="158" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">Monitors market</text>
<text x="107" y="174" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">data in real time,</text>
<text x="107" y="190" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">flags trends &amp;</text>
<text x="107" y="206" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">signals</text>
<text x="107" y="252" font-family="ui-monospace,Consolas,monospace" font-size="10.5" fill="#6B6862" text-anchor="middle">search + scrape</text>
</g>

<!-- Agent 2: Strategy Developer -->
<g>
<rect x="212" y="108" width="154" height="164" rx="8" fill="#191816" stroke="#3A3733"/>
<rect x="212" y="108" width="154" height="28" rx="8" fill="#22201E"/>
<rect x="212" y="126" width="154" height="10" fill="#22201E"/>
<text x="226" y="127" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#D97757">02</text>
<text x="289" y="127" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#F4F1EA" text-anchor="middle">Strategy Dev</text>
<text x="289" y="158" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">Drafts &amp; tests</text>
<text x="289" y="174" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">trading strategies</text>
<text x="289" y="190" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">from the analyst's</text>
<text x="289" y="206" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">insights</text>
<text x="289" y="252" font-family="ui-monospace,Consolas,monospace" font-size="10.5" fill="#6B6862" text-anchor="middle">risk tolerance</text>
</g>

<!-- Agent 3: Trade Advisor -->
<g>
<rect x="394" y="108" width="154" height="164" rx="8" fill="#191816" stroke="#3A3733"/>
<rect x="394" y="108" width="154" height="28" rx="8" fill="#22201E"/>
<rect x="394" y="126" width="154" height="10" fill="#22201E"/>
<text x="408" y="127" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#D97757">03</text>
<text x="471" y="127" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#F4F1EA" text-anchor="middle">Trade Advisor</text>
<text x="471" y="158" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">Suggests optimal</text>
<text x="471" y="174" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">execution: entry,</text>
<text x="471" y="190" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">exit &amp; position</text>
<text x="471" y="206" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">sizing</text>
<text x="471" y="252" font-family="ui-monospace,Consolas,monospace" font-size="10.5" fill="#6B6862" text-anchor="middle">available capital</text>
</g>

<!-- Agent 4: Risk Advisor -->
<g>
<rect x="576" y="108" width="154" height="164" rx="8" fill="#191816" stroke="#3A3733"/>
<rect x="576" y="108" width="154" height="28" rx="8" fill="#22201E"/>
<rect x="576" y="126" width="154" height="10" fill="#22201E"/>
<text x="590" y="127" font-family="ui-monospace,Consolas,monospace" font-size="12.5" fill="#D97757">04</text>
<text x="653" y="127" font-family="system-ui,sans-serif" font-size="12.5" font-weight="600" fill="#F4F1EA" text-anchor="middle">Risk Advisor</text>
<text x="653" y="158" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">Evaluates exposure</text>
<text x="653" y="174" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">of the proposed</text>
<text x="653" y="190" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">trade before it's</text>
<text x="653" y="206" font-family="system-ui,sans-serif" font-size="11.5" fill="#A29F94" text-anchor="middle">approved</text>
<text x="653" y="252" font-family="ui-monospace,Consolas,monospace" font-size="10.5" fill="#6B6862" text-anchor="middle">approval gate</text>
</g>

<line x1="184" y1="190" x2="208" y2="190" stroke="#D97757" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)"/>
<line x1="366" y1="190" x2="390" y2="190" stroke="#D97757" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)"/>
<line x1="548" y1="190" x2="572" y2="190" stroke="#D97757" stroke-width="1.6" stroke-linecap="round" marker-end="url(#ar2)"/>

<text x="380" y="302" font-family="ui-monospace,Consolas,monospace" font-size="12.5" letter-spacing="0.5" fill="#6B6862" text-anchor="middle">CrewAI &#183; hierarchical process &#183; investment recommendation</text>
</svg>
